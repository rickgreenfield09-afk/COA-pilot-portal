name: Deploy Functions API

# Path-filtered to the functions/ project only, per the locked CI/CD
# decision (2026-09-08) — a frontend-only commit to main should not
# redeploy the Functions API, matching how the Static Web App's own deploy
# is separate infrastructure from this one.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-deploy.yml'

# No approval gate for now (matches the frontend's auto-deploy-on-merge) —
# revisit before real production go-live, not before this internal demo.
#
# Deploys via OIDC (azure/login), not a publish-profile — the Function
# App has Basic Authentication disabled (secure-by-default on new
# resources), which a publish-profile depends on. OIDC uses short-lived
# federated tokens instead of a stored long-lived credential. The service
# principal (App Registration "COA - Aeris - GitHub Deploy", separate
# from the "COA - Aeris" login app) has a federated credential scoped to
# this exact repo + main branch, and needs the Website Contributor role
# on func-coa-prod-eus-01 to actually deploy — see ssp-log.md 2026-09-08,
# blocked on Sly Penguin granting that role assignment as of this commit.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build functions/functions.csproj --configuration Release --output ./functions-publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-coa-prod-eus-01
          package: './functions-publish'
